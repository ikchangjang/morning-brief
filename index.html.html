<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 아침 주식 브리핑</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --border:#e5e3dc; --text:#1c1c1a;
    --sub:#6b6a63; --accent:#0c447c; --accent-bg:#e6f1fb;
    --up:#639922; --up-bg:#eaf3de; --down:#e24b4a; --down-bg:#fcebeb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:24px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  header{margin-bottom:20px;}
  header h1{font-size:20px; font-weight:600; margin:0 0 4px;}
  header p{font-size:13px; color:var(--sub); margin:0;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;}
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .summary-grid .card{margin-bottom:0;}
  .label{font-size:12px; color:var(--sub); margin:0 0 6px;}
  .value{font-size:22px; font-weight:600; margin:0;}
  .value.up{color:var(--up);} .value.down{color:var(--down);}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .holding{border-top:1px solid var(--border); padding:12px 0;}
  .holding:first-child{border-top:none; padding-top:0;}
  .h-top{display:flex; justify-content:space-between; align-items:baseline;}
  .h-name{font-weight:600; font-size:15px;}
  .h-ticker{font-size:12px; color:var(--sub); margin-left:6px;}
  .h-price{font-size:13px; color:var(--sub); margin-top:2px;}
  .h-right{text-align:right;}
  .h-value{font-weight:600; font-size:15px;}
  .h-change{font-size:12px; padding:1px 6px; border-radius:6px; display:inline-block; margin-top:2px;}
  .h-change.up{color:var(--up); background:var(--up-bg);}
  .h-change.down{color:var(--down); background:var(--down-bg);}
  .bar-bg{height:6px; background:#eeece5; border-radius:3px; margin-top:8px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:3px;}
  .weight-pct{font-size:12px; color:var(--sub); margin-top:4px;}
  .add-form{display:flex; gap:8px; flex-wrap:wrap;}
  input, select{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px;
    background:#fafaf8; color:var(--text);
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  input#ticker{width:110px;} input#shares{width:90px;} input#avgcost{width:110px;}
  button{
    border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px;
    background:var(--card); cursor:pointer; color:var(--text);
  }
  button:hover{background:#f0efe9;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#0a3a68;}
  .del-btn{background:none; border:none; color:var(--sub); font-size:12px; cursor:pointer; padding:2px 4px;}
  .del-btn:hover{color:var(--down);}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:20px 0;}
  .status{font-size:12px; color:var(--sub); margin-top:8px;}
  .refresh-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .refresh-row h2{font-size:15px; font-weight:600; margin:0;}
  #lock-screen{
    max-width:340px; margin:80px auto; text-align:center;
  }
  #lock-screen h1{font-size:18px; font-weight:600; margin-bottom:16px;}
  #lock-screen input{width:100%; margin-bottom:10px; text-align:center;}
  #lock-screen button{width:100%;}
  #lock-error{color:var(--down); font-size:13px; margin-top:8px; min-height:16px;}
  #app{display:none;}
</style>
</head>
<body>

<div id="lock-screen">
  <h1>비밀번호를 입력하세요</h1>
  <input type="password" id="pw-input" placeholder="비밀번호" />
  <button class="primary" id="pw-btn">확인</button>
  <p id="lock-error"></p>
</div>

<div class="wrap" id="app">
  <header>
    <h1>오늘의 포트폴리오 브리핑</h1>
    <p id="today-date"></p>
  </header>

  <div class="summary-grid card" style="padding:0; background:none; border:none;">
    <div class="card">
      <p class="label">총 평가금액</p>
      <p class="value" id="total-value">-</p>
    </div>
    <div class="card">
      <p class="label">전일 대비</p>
      <p class="value" id="total-change">-</p>
    </div>
  </div>

  <div class="card">
    <div class="refresh-row">
      <h2>보유 종목</h2>
      <button id="refresh-btn">시세 새로고침</button>
    </div>
    <div id="holdings-list"></div>
    <p class="status" id="status-msg"></p>
  </div>

  <div class="card">
    <h2 style="font-size:15px; font-weight:600; margin:0 0 12px;">종목 추가</h2>
    <div class="add-form">
      <input id="ticker" placeholder="티커 (예: UFO)" />
      <input id="shares" placeholder="수량" type="number" step="any" />
      <input id="avgcost" placeholder="평단가(선택, $)" type="number" step="any" />
      <button class="primary" id="add-btn">추가</button>
    </div>
    <p class="status">예: UFO, ROKT, ARKX, LOAD 등 우주/방산 관련 ETF 티커를 입력하세요.</p>
  </div>
</div>

<script>
// 비밀번호는 여기서 원하는 값으로 바꾸세요
const SITE_PASSWORD = 'family2026';

function checkAuth(){
  return sessionStorage.getItem('authed') === 'yes';
}
function tryLogin(){
  const input = document.getElementById('pw-input');
  const err = document.getElementById('lock-error');
  if(input.value === SITE_PASSWORD){
    sessionStorage.setItem('authed', 'yes');
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadHoldings();
  } else {
    err.textContent = '비밀번호가 올바르지 않습니다.';
    input.value = '';
  }
}
document.getElementById('pw-btn').addEventListener('click', tryLogin);
document.getElementById('pw-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryLogin();
});
let holdings = [];

if(checkAuth()){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadHoldings();
}

const dateEl = document.getElementById('today-date');
dateEl.textContent = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

async function loadHoldings(){
  try{
    const raw = localStorage.getItem('holdings');
    holdings = raw ? JSON.parse(raw) : [];
  }catch(e){
    holdings = [];
  }
  render();
  if(holdings.length) refreshPrices();
}

async function saveHoldings(){
  try{
    localStorage.setItem('holdings', JSON.stringify(holdings));
  }catch(e){
    setStatus('저장 중 오류가 발생했습니다.');
  }
}

function setStatus(msg){
  document.getElementById('status-msg').textContent = msg;
}

function fmtUsd(n){
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtPct(n){
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}

async function fetchPrice(ticker){
  try{
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const result = data.chart.result[0];
    const price = result.meta.regularMarketPrice;
    const prevClose = result.meta.previousClose ?? result.meta.chartPreviousClose;
    return { price, prevClose, ok: true };
  }catch(e){
    return { ok: false };
  }
}

async function refreshPrices(){
  setStatus('시세를 불러오는 중...');
  let failCount = 0;
  for(const h of holdings){
    const r = await fetchPrice(h.ticker);
    if(r.ok){
      h.price = r.price;
      h.prevClose = r.prevClose;
      h.lastUpdated = Date.now();
    } else {
      failCount++;
    }
  }
  await saveHoldings();
  render();
  setStatus(failCount > 0
    ? `${failCount}개 종목은 시세를 가져오지 못했습니다. 수동으로 가격을 확인해주세요.`
    : `마지막 업데이트: ${new Date().toLocaleTimeString('ko-KR')}`);
}

function render(){
  const list = document.getElementById('holdings-list');
  list.innerHTML = '';

  if(holdings.length === 0){
    list.innerHTML = '<p class="empty">아직 등록된 종목이 없습니다. 아래에서 추가해보세요.</p>';
    document.getElementById('total-value').textContent = '-';
    document.getElementById('total-change').textContent = '-';
    return;
  }

  const valued = holdings.map(h => {
    const price = h.price ?? h.avgCost ?? 0;
    const value = price * h.shares;
    const prevValue = (h.prevClose ?? price) * h.shares;
    const change = h.prevClose ? ((price - h.prevClose) / h.prevClose) * 100 : 0;
    return { ...h, price, value, prevValue, change };
  });

  const totalValue = valued.reduce((s,h) => s + h.value, 0);
  const totalPrevValue = valued.reduce((s,h) => s + h.prevValue, 0);
  const totalChangePct = totalPrevValue ? ((totalValue - totalPrevValue) / totalPrevValue) * 100 : 0;

  document.getElementById('total-value').textContent = fmtUsd(totalValue);
  const changeEl = document.getElementById('total-change');
  changeEl.textContent = fmtPct(totalChangePct);
  changeEl.className = 'value ' + (totalChangePct >= 0 ? 'up' : 'down');

  valued.sort((a,b) => b.value - a.value);

  valued.forEach((h) => {
    const weight = totalValue ? (h.value / totalValue) * 100 : 0;
    const el = document.createElement('div');
    el.className = 'holding';
    el.innerHTML = `
      <div class="h-top">
        <div>
          <span class="h-name">${h.ticker}</span>
          <span class="h-ticker">${h.shares}주</span>
          <div class="h-price">${h.price ? fmtUsd(h.price) : '가격 미확인'}</div>
        </div>
        <div class="h-right">
          <div class="h-value">${fmtUsd(h.value)}</div>
          ${h.prevClose ? `<span class="h-change ${h.change >= 0 ? 'up' : 'down'}">${fmtPct(h.change)}</span>` : ''}
        </div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(weight,100)}%"></div></div>
      <div class="row">
        <span class="weight-pct">비중 ${weight.toFixed(1)}%</span>
        <button class="del-btn" data-ticker="${h.ticker}">삭제</button>
      </div>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      holdings = holdings.filter(h => h.ticker !== btn.dataset.ticker);
      await saveHoldings();
      render();
    });
  });
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const tickerInput = document.getElementById('ticker');
  const sharesInput = document.getElementById('shares');
  const avgCostInput = document.getElementById('avgcost');

  const ticker = tickerInput.value.trim().toUpperCase();
  const shares = parseFloat(sharesInput.value);
  const avgCost = parseFloat(avgCostInput.value);

  if(!ticker){ setStatus('티커를 입력해주세요.'); return; }
  if(!shares || shares <= 0){ setStatus('올바른 수량을 입력해주세요.'); return; }

  if(holdings.some(h => h.ticker === ticker)){
    setStatus('이미 등록된 종목입니다.');
    return;
  }

  holdings.push({
    ticker,
    shares,
    avgCost: isNaN(avgCost) ? null : avgCost,
    price: null,
    prevClose: null
  });

  tickerInput.value = ''; sharesInput.value = ''; avgCostInput.value = '';
  await saveHoldings();
  render();
  setStatus('종목을 추가했습니다. 시세를 불러오는 중...');
  const r = await fetchPrice(ticker);
  const h = holdings.find(x => x.ticker === ticker);
  if(r.ok){ h.price = r.price; h.prevClose = r.prevClose; await saveHoldings(); render(); setStatus(''); }
  else{ setStatus('시세를 가져오지 못했습니다. 새로고침을 눌러 다시 시도해보세요.'); }
});

document.getElementById('refresh-btn').addEventListener('click', refreshPrices);
</script>
</body>
</html>
